<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>CFS — 2026 Full Year Gate Map</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#c9a84c;--ink:#12121e;--slate:#1c1c2e;--deep:#0a0a12;
  --rim:rgba(201,168,76,0.28);--mist:rgba(201,168,76,0.1);
  --txt:#e8e0d0;--dim:#8a8070;--soft:#b0a890;
  --green:#4ecb71;--blue:#6a9fe8;--amber:#e8c96a;--red:#e85c4a;--purple:#b86ae8;
  --org:#4a8fd4;--com:#c85a5a;--lead:#c9a84c;--create:#4ecb71;
}
html,body{background:var(--deep);color:var(--txt);font-family:'Crimson Pro',Georgia,serif;min-height:100vh;overflow-x:hidden}
body{padding-bottom:2rem}
.app{max-width:640px;margin:0 auto}

.hdr{text-align:center;padding:1.5rem 1rem .75rem;border-bottom:0.5px solid var(--rim)}
.hdr h1{font-family:'Cinzel',serif;font-size:19px;font-weight:400;color:var(--gold);letter-spacing:.14em}
.hdr p{font-size:11px;color:var(--dim);letter-spacing:.07em;margin-top:4px}

/* MONTH NAV */
.month-nav{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding:.75rem 1rem;border-bottom:0.5px solid var(--rim);background:var(--deep);position:sticky;top:0;z-index:50;scrollbar-width:none}
.month-nav::-webkit-scrollbar{display:none}
.mnav-btn{flex-shrink:0;background:var(--slate);border:0.5px solid var(--rim);border-radius:8px;color:var(--dim);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.06em;padding:6px 12px;cursor:pointer;transition:all .2s;white-space:nowrap}
.mnav-btn.active{background:var(--mist);border-color:var(--gold);color:var(--gold)}
.mnav-btn.create-m{border-color:rgba(78,203,113,0.4);color:rgba(78,203,113,0.7)}
.mnav-btn.create-m.active{background:rgba(78,203,113,0.1);border-color:var(--green);color:var(--green)}
.mnav-btn.current-m{border-color:var(--gold)}

/* PANES */
.mpane{display:none;padding:1rem}.mpane.active{display:block}

/* CARDS */
.card{background:var(--ink);border:0.5px solid var(--rim);border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:1rem}
.card-title{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);letter-spacing:.1em;margin-bottom:.7rem}
.card p{font-size:14px;line-height:1.75;color:var(--txt);font-weight:300;margin-bottom:.5rem}
.card p:last-child{margin-bottom:0}
.card em{color:var(--soft)}

/* MONTH HEADER */
.m-header{background:var(--ink);border:0.5px solid var(--rim);border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:1rem}
.m-header.create-h{border-color:rgba(78,203,113,0.4);background:rgba(78,203,113,0.03)}
.m-header.current-h{border-color:var(--gold)}
.m-lun{font-size:11px;color:var(--dim);font-family:'Cinzel',serif;letter-spacing:.05em;margin-bottom:4px}
.m-name{font-family:'Cinzel',serif;font-size:20px;color:var(--gold);letter-spacing:.1em;margin-bottom:.5rem}
.m-sig{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:.6rem}
.pill{display:inline-block;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.04em;padding:3px 10px;border-radius:12px;white-space:nowrap}
.p-org{background:rgba(74,143,212,0.12);color:#4a8fd4;border:0.5px solid rgba(74,143,212,0.4)}
.p-com{background:rgba(200,90,90,0.12);color:#c85a5a;border:0.5px solid rgba(200,90,90,0.4)}
.p-lead{background:rgba(201,168,76,0.12);color:#c9a84c;border:0.5px solid rgba(201,168,76,0.4)}
.p-create{background:rgba(78,203,113,0.12);color:#4ecb71;border:0.5px solid rgba(78,203,113,0.4)}
.arr{color:var(--dim);font-size:13px}
.badge{display:inline-block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.06em;padding:2px 9px;border-radius:8px}
.badge-create{background:rgba(78,203,113,0.1);border:0.5px solid rgba(78,203,113,0.4);color:var(--green)}
.badge-now{background:rgba(201,168,76,0.12);border:0.5px solid rgba(201,168,76,0.4);color:var(--gold)}
.badge-anchor{background:rgba(74,143,212,0.1);border:0.5px solid rgba(74,143,212,0.3);color:#4a8fd4}
.badge-stable{background:rgba(201,168,76,0.08);border:0.5px solid rgba(201,168,76,0.2);color:var(--soft)}
.m-dates{font-size:12px;color:var(--dim);margin-top:.3rem}
.m-body{font-size:14px;line-height:1.75;color:var(--txt);font-weight:300}

/* GATE BOXES */
.gate-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.gate-box{border-radius:9px;padding:.75rem .9rem;border:0.5px solid}
.gate-box.close{background:rgba(232,92,74,0.06);border-color:rgba(232,92,74,0.35)}
.gate-box.open{background:rgba(78,203,113,0.05);border-color:rgba(78,203,113,0.35)}
.g-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.09em;margin-bottom:3px}
.g-label.close{color:var(--red)}.g-label.open{color:var(--green)}
.g-date{font-size:14px;color:var(--txt);font-variant-numeric:tabular-nums}
.g-sub{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.4}

/* PHASE BLOCKS */
.phase-list{display:flex;flex-direction:column;gap:7px;margin-bottom:1rem}
.phase-block{border-radius:9px;padding:.85rem 1rem;border:0.5px solid;position:relative}
.ph-label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.09em;margin-bottom:3px}
.ph-dates{font-size:11px;color:var(--dim);margin-bottom:5px;font-variant-numeric:tabular-nums}
.ph-desc{font-size:13px;line-height:1.65;font-weight:300}

.ph-prep{background:rgba(106,158,232,.07);border-color:rgba(106,158,232,.25)}
.ph-prep .ph-label{color:#9dbfe8}
.ph-prep .ph-desc{color:#9dbfe8}

.ph-ax{background:rgba(184,106,232,.07);border-color:rgba(184,106,232,.22)}
.ph-ax .ph-label{color:#c898ea}
.ph-ax .ph-desc{color:var(--soft)}

.ph-int{background:rgba(201,168,76,.07);border-color:rgba(201,168,76,.22)}
.ph-int .ph-label{color:var(--gold)}
.ph-int .ph-desc{color:var(--soft)}

.ph-close{background:rgba(232,92,74,.08);border-color:rgba(232,92,74,.35)}
.ph-close .ph-label{color:var(--red)}
.ph-close .ph-desc{color:var(--txt)}

.ph-open{background:rgba(78,203,113,.07);border-color:rgba(78,203,113,.3)}
.ph-open .ph-label{color:var(--green)}
.ph-open .ph-desc{color:var(--txt)}

.ph-seq{background:rgba(138,128,112,.08);border-color:rgba(138,128,112,.2)}
.ph-seq .ph-label{color:var(--dim)}
.ph-seq .ph-desc{color:var(--soft)}

.ph-now{border-width:1px!important}
.ph-now::before{content:"▶ NOW";position:absolute;top:.5rem;right:.75rem;font-family:'Cinzel',serif;font-size:9px;color:var(--gold);letter-spacing:.08em}

@media(max-width:420px){
  .gate-pair{grid-template-columns:1fr}
  .ph-desc{font-size:12px}
}
</style>
</head>

// ── BUILD UI ──────────────────────────────────────────────────────────────
function pillH(q){
  var cls={Org:'org',Com:'com',Lead:'lead',Create:'create'}[q]||'org';
  return '<span class="pill p-'+cls+'">'+q+'</span>';
}

var nav=document.getElementById('monthNav');
var container=document.getElementById('paneContainer');
var now=new Date();

LUNATIONS.forEach(function(l,i){
  var isCurrent=(now>=new Date(l.dates.split('–')[0].trim().replace(/(\w+ \d+)$/,'$1 2026'))&&
    now<=new Date(l.dates.split('–')[1].trim()+(l.dates.split('–')[1].trim().includes('2027')?'':' 2026')));
  // simpler current check
  var monthIdx={January:0,February:1,March:2,April:3,May:4,June:5,July:6,August:7,September:8,October:9,November:10,December:11};
  isCurrent = monthIdx[l.month]===now.getMonth() && l.month!=='January';

  // nav button
  var btn=document.createElement('button');
  btn.className='mnav-btn'+(l.create?' create-m':'')+(isCurrent?' current-m active':'');
  btn.textContent=l.month.substring(0,3).toUpperCase()+(l.create?' ▲':'');
  btn.onclick=(function(idx){return function(){showPane(idx)}})(i);
  nav.appendChild(btn);

  // pane
  var pane=document.createElement('div');
  pane.className='mpane'+(isCurrent?' active':'');
  pane.id='pane-'+i;

  var hdrCls='m-header'+(l.create?' create-h':'')+(isCurrent?' current-h':'');
  var sig='<div class="m-sig">'+pillH(l.held)+'<span class="arr">→</span>'
    +(l.create?pillH('Create')+'<span class="arr">→</span>':'')+pillH(l.expressed)+'</div>';
  var badges='';
  if(isCurrent)badges+='<span class="badge badge-now">NOW</span> ';
  if(l.create)badges+='<span class="badge badge-create">▲ CREATE GATE</span> ';
  if(l.anchor)badges+='<span class="badge badge-anchor">ANCHOR</span> ';
  if(l.stable&&!l.anchor)badges+='<span class="badge badge-stable">STABILIZER</span>';

  var phases='';
  l.phases.forEach(function(p){
    phases+='<div class="phase-block '+p.cls+'">'
      +'<div class="ph-label">'+p.label+'</div>'
      +'<div class="ph-dates">'+p.dates+'</div>'
      +'<div class="ph-desc">'+p.desc+'</div>'
      +'</div>';
  });

  pane.innerHTML='<div class="'+hdrCls+'">'
    +'<div style="font-family:Cinzel,serif;font-size:11px;color:var(--dim);letter-spacing:.06em;margin-bottom:3px">'+l.lun+'</div>'
    +'<div style="font-family:Cinzel,serif;font-size:22px;color:var(--gold);letter-spacing:.1em;margin-bottom:.4rem">'+l.month+'</div>'
    +sig
    +'<div style="font-size:11px;color:var(--dim);margin-bottom:.5rem">'+l.dates+'</div>'
    +'<div style="margin-bottom:.5rem">'+badges+'</div>'
    +'<div style="font-size:13px;color:var(--soft);letter-spacing:.03em;font-style:italic">'+l.sig_note+'</div>'
    +'</div>'
    +'<div class="card"><div class="card-title">WHAT THIS MONTH MEANS</div><p>'+l.body+'</p></div>'
    +'<div style="font-family:Cinzel,serif;font-size:10px;color:var(--dim);letter-spacing:.1em;margin-bottom:.6rem;padding:0 .1rem">PHASE TIMELINE</div>'
    +'<div class="phase-list">'+phases+'</div>';

  container.appendChild(pane);
});

function showPane(idx){
  document.querySelectorAll('.mpane').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.mnav-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById('pane-'+idx).classList.add('active');
  document.querySelectorAll('.mnav-btn')[idx].classList.add('active');
  window.scrollTo(0,0);
}

// scroll to current month in nav
var activeBtn=document.querySelector('.mnav-btn.active');
if(activeBtn)activeBtn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
</script>
